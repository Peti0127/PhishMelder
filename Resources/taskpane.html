<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forward email</title>

  <!-- Required Outlook/Office JavaScript runtime -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  
  <style>
    body {
    margin: 0;
    padding: 30px;
    font-family: "Aptos", Arial, sans-serif;
    color: #242424;
    background: #ffffff;
    position: relative;
    min-height: 100vh;
    overflow: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background: url("https://peti0127.github.io/PhishMelder/Resources/Pictures/background.png")
                center left / auto no-repeat;

    z-index: -1;
}

    main {
      max-width: 420px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 20px;
      font-weight: 600;
    }

    p {
      line-height: 1.5;
    }

    button {
      min-width: 100px;
      border: 0;
      border-radius: 5px;
      padding: 10px 18px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      background: #eb830c;
      cursor: pointer;
    }

    button:hover {
      background: #D97706;
    }
    
    
    button:disabled {
      cursor: default;
      background: #a7a7a7;
    }


    #status {
      min-height: 24px;
      margin-top: 16px;
      font-size: 18px;
    }

    .error {
      color: #a4262c;
    }

    .success {
      color: #107c10;
    }
  </style>
</head>

<body>
  <main>
    <h2 style="color:#1F1F1F">Verdächtige Email?</h2>
    <p style="color:#424242"> <bold>Hier kannst du sie an EDV melden!</bold></p>
    <p style="color:#424242">die Meldung geht an <strong style="color:#D97706">phishing@attensam.at</strong></p>

    <button id="sendButton" type="button" disabled>Melden</button>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="./taskpane.bundle.js"></script>
</body>
</html>
